name: Weekly R CMD check (latest R)

# Canary check against the latest released R, run weekly so that a new R
# release breaking the shipped binaries is caught early rather than by users.
# macOS runs on the newest GA image (macos-26) rather than the org default
# (GHA_DEFAULT_RUNNER_MACOS), so a new macOS release is also caught early.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main
    with:
      build-binary: false
      os-matrix: >-
        [{"os": "${{ vars.GHA_DEFAULT_RUNNER_WINDOWS || 'windows-latest' }}", "r": "release"},
        {"os": "${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-latest' }}", "r": "release"},
        {"os": "macos-26", "r": "release"}]
