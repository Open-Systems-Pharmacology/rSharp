name: Weekly R CMD check (latest R)

# Canary check against the latest released R, run weekly so that a new R
# release breaking the shipped binaries is caught early rather than by users.
# All platforms run on the -latest runner images rather than the org defaults
# (GHA_DEFAULT_RUNNER_*), so a new OS image release is also caught early.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main
    with:
      build-binary: false
      os-matrix: >-
        [{"os": "windows-latest", "r": "release"},
        {"os": "ubuntu-latest", "r": "release"},
        {"os": "macos-latest", "r": "release"}]
